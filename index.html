<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--txt:#16181d;--mut:#6b7280;--line:#e3e5ea;--acc:#4f6ef7;--good:#22a06b;--warn:#d97706;--bad:#dc2626;--r:14px;--nav-h:60px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--card:#181b20;--txt:#e8eaee;--mut:#8a919e;--line:#262a31;--acc:#7b93ff;--good:#34c98b;--warn:#f0a12e;--bad:#f26565}}
:root[data-theme="dark"]{--bg:#0e1013;--card:#181b20;--txt:#e8eaee;--mut:#8a919e;--line:#262a31;--acc:#7b93ff;--good:#34c98b;--warn:#f0a12e;--bad:#f26565}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px)}
main{max-width:760px;margin:0 auto;padding:12px}
section[hidden]{display:none}
h2{font-size:1.05rem;margin:18px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:.85rem}
.small{font-size:.8rem}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{min-height:36px;padding:4px 10px;font-size:.85rem}
.btn.ghost{border-style:dashed;color:var(--mut)}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--bad)}
input[type=number],input[type=text],input[type=date],select{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px;width:110px;max-width:100%}
input[type=text]{width:160px}
input[type=date]{width:150px}
select{width:auto;min-width:90px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
label.fld{display:inline-flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--mut);margin:4px 8px 4px 0}
.rowflex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{border-top:1px solid var(--line);padding:12px 2px}
.grow:first-child{border-top:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.glabel{font-weight:600;flex:1}
.gval{font-variant-numeric:tabular-nums;color:var(--mut);font-size:.9rem}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:3px}
.warnnote{color:var(--warn);font-size:.8rem;margin-top:6px}
.slot{width:56px;height:44px;border-radius:12px;border:1.5px dashed var(--line);color:var(--mut);font-weight:700}
.slot.f{border-style:solid;background:var(--acc);border-color:var(--acc);color:#fff}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:.8rem;font-weight:600}
.chooser{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{min-height:36px;padding:4px 12px;border-radius:9px;font-weight:600;font-size:.85rem;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.donutwrap{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}
.datebar{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 10px}
.datebar .pill{font-weight:700;min-width:150px;text-align:center}
.editbanner{background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid var(--warn);border-radius:10px;padding:8px 12px;font-size:.85rem;margin-bottom:10px;text-align:center}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:none}
.hm{display:flex;gap:3px;overflow-x:auto;padding:4px 0}
.hm .wk{display:flex;flex-direction:column;gap:3px}
.hm .c{width:14px;height:14px;border-radius:3px;background:var(--line);flex:none}
.hm .c.today{outline:2px solid var(--txt);outline-offset:-1px}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:50}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--mut)}
nav button.on{color:var(--acc)}
nav .ic{font-size:1.15rem;line-height:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);background:var(--txt);color:var(--bg);border-radius:12px;padding:10px 14px;display:none;align-items:center;gap:14px;z-index:99;max-width:92vw;font-size:.9rem;font-weight:600}
#toast button{color:var(--acc);font-weight:800}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal .box{background:var(--card);border-radius:var(--r);padding:18px;max-width:360px;width:100%}
@media(min-width:768px){main{padding:20px}.hm .c{width:16px;height:16px}}
</style>
</head>
<body>
<main>
  <section id="scr-today"></section>
  <section id="scr-study" hidden></section>
  <section id="scr-metrics" hidden></section>
  <section id="scr-settings" hidden></section>
</main>
<nav id="nav">
  <button data-nav="today" class="on"><span class="ic">◔</span>Today</button>
  <button data-nav="study"><span class="ic">📚</span>Study</button>
  <button data-nav="metrics"><span class="ic">📈</span>Metrics</button>
  <button data-nav="settings"><span class="ic">⚙︎</span>Settings</button>
</nav>
<div id="toast"><span id="toastmsg"></span><button id="toastundo" hidden>Undo</button></div>
<div id="modal"><div class="box" id="modalbox"></div></div>
<script>
"use strict";
/* ================= helpers ================= */
const $=(s,el)=>(el||document).querySelector(s);
const $$=(s,el)=>Array.from((el||document).querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null;};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const fmtInt=n=>(n==null?"—":Math.round(n).toLocaleString("en-IN"));
const fmt1=n=>(n==null?"—":(Math.round(n*10)/10).toString());
const uid=()=>Math.random().toString(36).slice(2,9);
const deep=o=>JSON.parse(JSON.stringify(o));
const PAL=["#4f6ef7","#22a06b","#e0653a","#b45de0","#d99a06","#2aa8c4","#e0568f","#7a8699","#5fae4e","#c46a5a"];
const colorOf=i=>PAL[i%PAL.length];

/* ================= IST time — app runs on UTC+5:30 on every device ================= */
/* toISOString is FORBIDDEN for day keys. Day keys come only from ymdFromDate(). */
const IST_MIN=330;
function istNow(){const d=new Date();return new Date(d.getTime()+(d.getTimezoneOffset()+IST_MIN)*60000);}
function ymdFromDate(d){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function parseYMD(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12,0,0);}
function logicalToday(){const t=istNow();const sh=new Date(t.getTime()-(S.settings.rolloverHour||0)*3600000);return ymdFromDate(sh);}
function addDays(s,n){const d=parseYMD(s);d.setDate(d.getDate()+n);return ymdFromDate(d);}
function daysBetween(a,b){return Math.round((parseYMD(b)-parseYMD(a))/86400000);}
function dowMon(s){return (parseYMD(s).getDay()+6)%7;}
function yearOf(s){return s.slice(0,4);}
function isoWeekKey(s){const d=parseYMD(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const wy=d.getFullYear();const jan4=new Date(wy,0,4,12);
  const w=1+Math.round(((d-jan4)/86400000-3+((jan4.getDay()+6)%7))/7);return wy+"-W"+String(w).padStart(2,"0");}
function fmtDay(s){return parseYMD(s).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});}
function fmtShort(s){return parseYMD(s).toLocaleDateString("en-IN",{day:"numeric",month:"short"});}

/* ================= defaults & storage ================= */
const DEF={
 meta:{schemaVersion:1,firstUse:null,persistAsked:false},
 settings:{rolloverHour:4,backfillDays:7,unlockHistory:false,streakMin:100,theme:"system",lastExport:null,nudgeSnoozedUntil:null},
 goals:[
  {id:"study",label:"Study",kind:"countup",target:2,unit:"sessions",active:true},
  {id:"steps",label:"Steps",kind:"countup",target:10000,unit:"steps",active:true},
  {id:"strength",label:"Strength",kind:"tick",active:true},
  {id:"food",label:"Food",kind:"composite",active:true,children:[
    {id:"kcal",label:"Calories",kind:"band",target:1800,tol:100,unit:"kcal",active:true},
    {id:"protein",label:"Protein",kind:"countup",target:120,unit:"g",active:true}]},
  {id:"recovery",label:"Recovery",kind:"composite",active:true,children:[
    {id:"cortisol",label:"Low-cortisol day",kind:"tick",active:true},
    {id:"sleepH",label:"Sleep",kind:"countup",target:8,unit:"h",active:true}]},
  {id:"water",label:"Water",kind:"tick",active:true},
  {id:"review",label:"Review today",kind:"tick",active:true},
  {id:"plan",label:"Plan tomorrow",kind:"tick",active:true}],
 days:{},
 lifts:[{id:uid(),name:"Incline DB Chest Press",entries:[]},{id:uid(),name:"Lat Pulldown",entries:[]}],
 body:{heightCm:null,goalKg:null,entries:[]},
 year:{}
};
const KEYS=["meta","settings","goals","days","lifts","body","year"];
const BUILTIN=new Set(DEF.goals.map(g=>g.id));
const QUICK={kcal:100,protein:25};
const S={};
let corruptNote=false;
function loadKey(k){const raw=localStorage.getItem("hb:"+k);
  if(raw==null){S[k]=deep(DEF[k]);saveKey(k);return;}
  try{S[k]=JSON.parse(raw);}
  catch(e){localStorage.setItem("hb:corrupt-"+k+"-"+Date.now(),raw);S[k]=deep(DEF[k]);saveKey(k);corruptNote=true;}}
function saveKey(k){localStorage.setItem("hb:"+k,JSON.stringify(S[k]));}
function loadAll(){KEYS.forEach(loadKey);
  for(const f in DEF.settings) if(S.settings[f]===undefined) S.settings[f]=DEF.settings[f];
  if(!S.meta.firstUse){S.meta.firstUse=logicalToday();saveKey("meta");}}

/* ================= registry / snapshots ================= */
function activeChildren(g){return (g.children||[]).filter(c=>c.active!==false);}
function isActiveGoal(g){if(g.active===false) return false;if(g.kind==="composite") return activeChildren(g).length>0;return true;}
function snapshotRegistry(){return S.goals.filter(isActiveGoal).map(g=>{
  const s={id:g.id,label:g.label,kind:g.kind};
  if(g.kind!=="tick"&&g.kind!=="composite"){s.target=g.target;s.unit=g.unit;if(g.kind==="band") s.tol=g.tol;}
  if(g.kind==="composite") s.children=activeChildren(g).map(c=>{const cs={id:c.id,label:c.label,kind:c.kind};
    if(c.kind!=="tick"){cs.target=c.target;cs.unit=c.unit;if(c.kind==="band") cs.tol=c.tol;}return cs;});
  return s;});}
function getDay(dk){return S.days[dk]||null;}
function ensureDay(dk){if(!S.days[dk]) S.days[dk]={snap:snapshotRegistry(),v:{}};return S.days[dk];} /* created on first EDIT only */
function commitDay(){saveKey("days");}

/* ================= scoring ================= */
function fillOf(g,v){
  if(g.kind==="tick") return v[g.id]===true?100:0;
  if(g.kind==="band"){const val=num(v[g.id]);if(val==null) return 0;const t=Math.max(1,g.target),tol=Math.max(1,g.tol||1),d=Math.abs(val-t);
    return d<=tol?100:clamp(100*(1-(d-tol)/(3*tol)),0,100);}
  if(g.kind==="countup"){const t=Math.max(1,g.target);const val=g.id==="study"?(v.sessions||[]).length:num(v[g.id]);
    if(val==null) return 0;return clamp(val/t*100,0,100);}
  if(g.kind==="composite"){const ch=g.children||[];if(!ch.length) return 0;return mean(ch.map(c=>fillOf(c,v)));}
  return 0;}
function dayPct(rec){if(!rec||!rec.snap||!rec.snap.length) return null;return mean(rec.snap.map(g=>fillOf(g,rec.v)));}
function streakCount(){const min=S.settings.streakMin,today=logicalToday();let c=0,d=addDays(today,-1);
  while(true){const r=getDay(d);if(!r) break;const p=dayPct(r);if(p==null||p<min) break;c++;d=addDays(d,-1);}
  const tr=getDay(today);if(tr){const p=dayPct(tr);if(p!=null&&p>=min) c++;}return c;}

/* ================= yearly study targets (reset every Jan 1) ================= */
function ensureYearRow(y){if(S.year[y]) return;const prev=Object.keys(S.year).sort().pop();const base=prev?S.year[prev]:null;
  S.year[y]={reading:{target:base?base.reading.target:250,headStart:0},revision:{target:base?base.revision.target:250,headStart:0}};saveKey("year");}
function sessionCount(y,type){let n=0;for(const dk in S.days){if(yearOf(dk)!==y) continue;for(const s of (S.days[dk].v.sessions||[])) if(s.type===type) n++;}return n;}
function yearDone(y,type){ensureYearRow(y);return (S.year[y][type].headStart||0)+sessionCount(y,type);}
function paceText(y,type){const t=S.year[y][type].target,done=yearDone(y,type);const rem=Math.max(0,t-done);if(rem===0) return "Done ✓";
  const today=logicalToday();const dl=yearOf(today)===y?daysBetween(today,y+"-12-31")+1:0;if(dl<=0) return rem+" left";
  return fmt1(rem/(dl/7))+" /week to finish by Dec 31";}

/* ================= soft warnings ================= */
function warnFor(id,val){if(val==null) return null;const m="unusual value — saved anyway";
  if(id==="steps"&&val>60000) return m;if(id==="kcal"&&val>6000) return m;if(id==="protein"&&val>400) return m;
  if(id==="sleepH"&&val>16) return m;if(id==="kg"&&(val<30||val>250)) return m;return null;}

/* ================= toast / undo / modal ================= */
let toastTimer=null,toastUndoFn=null,pendingImport=null;
function toast(msg,undoFn){const t=$("#toast");$("#toastmsg").textContent=msg;toastUndoFn=undoFn||null;$("#toastundo").hidden=!undoFn;
  t.style.display="flex";clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.style.display="none";toastUndoFn=null;},5000);}
function showModal(html){$("#modalbox").innerHTML=html;$("#modal").style.display="flex";}
function hideModal(){$("#modal").style.display="none";}

/* ================= UI state ================= */
let viewDate=null,lastToday=null,curScreen="today",winSel="30",openLift=null,chartMode="top",lastSessType="reading",chooser=null;
function show(sc){curScreen=sc;$$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.nav===sc));
  ["today","study","metrics","settings"].forEach(s=>{$("#scr-"+s).hidden=(s!==sc);});rerender();window.scrollTo(0,0);}
function rerender(){const t=logicalToday();if(viewDate==null||(viewDate===lastToday&&t!==lastToday)||viewDate>t) viewDate=t;lastToday=t;
  ensureYearRow(yearOf(t));({today:renderToday,study:renderStudy,metrics:renderMetrics,settings:renderSettings})[curScreen]();}
function commitAndRender(){setTimeout(()=>{const a=document.activeElement,k=a&&a.dataset?a.dataset.k:null;rerender();
  if(k){const el=$('[data-k="'+k+'"]');if(el) el.focus();}},0);}
function applyTheme(){const t=S.settings.theme;if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");}

/* ================= SVG builders ================= */
function pol(cx,cy,r,a){const t=(a-90)*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)];}
function arcPath(cx,cy,r,a0,a1){const [x0,y0]=pol(cx,cy,r,a0),[x1,y1]=pol(cx,cy,r,a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;}
function donutSVG(goals,v,pct,streak){const n=goals.length,cx=120,cy=120,r=94,sw=22;let paths="";
  if(n){const seg=360/n,gap=3;goals.forEach((g,i)=>{const a0=i*seg+gap/2,a1=(i+1)*seg-gap/2,f=fillOf(g,v),col=colorOf(i);
    paths+=`<path d="${arcPath(cx,cy,r,a0,a1)}" stroke="${col}" stroke-opacity=".18" stroke-width="${sw}" fill="none" data-act="gotorow" data-id="${g.id}"/>`;
    if(f>0){const ae=f>=99.99?a1:a0+(a1-a0)*f/100;paths+=`<path d="${arcPath(cx,cy,r,a0,ae)}" stroke="${col}" stroke-width="${sw}" fill="none" data-act="gotorow" data-id="${g.id}"/>`;}});}
  const label=pct==null?"—":Math.round(pct)+"%";
  return `<svg viewBox="0 0 240 240" width="230" height="230" style="cursor:pointer">${paths}
   <text x="120" y="122" text-anchor="middle" font-size="40" font-weight="800" fill="var(--txt)">${label}</text>
   <text x="120" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="var(--mut)">🔥 ${streak}</text></svg>`;}
function ringSVG(pct,size){const r=40,sw=10;const p=pct==null?0:clamp(pct,0,100);const ae=p>=99.99?359.999:360*p/100;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}"><circle cx="50" cy="50" r="${r}" stroke="var(--line)" stroke-width="${sw}" fill="none"/>
   ${p>0?`<path d="${arcPath(50,50,r,0,ae)}" stroke="var(--acc)" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`:""}
   <text x="50" y="57" text-anchor="middle" font-size="22" font-weight="800" fill="var(--txt)">${pct==null?"—":Math.round(pct)+"%"}</text></svg>`;}
function lineChartSVG(pts,o){o=o||{};const W=320,H=160,L=42,R=12,T=14,B=26;
  if(!pts.length) return `<div class="mut" style="padding:18px 0;text-align:center">${esc(o.empty||"No data yet")}</div>`;
  const ys=pts.map(p=>p.y);if(o.goal!=null) ys.push(o.goal);
  let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<1e-9){lo-=1;hi+=1;}const pad=(hi-lo)*.08;lo-=pad;hi+=pad;
  const d0=pts[0].d,dN=pts[pts.length-1].d,span=Math.max(1,daysBetween(d0,dN));
  const X=p=>pts.length===1?(L+(W-L-R)/2):L+(W-L-R)*daysBetween(d0,p.d)/span;const Y=y=>T+(H-T-B)*(1-(y-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:220px;font-size:10px">`;
  for(let i=0;i<=2;i++){const yv=lo+(hi-lo)*i/2,yy=Y(yv);
    s+=`<line x1="${L}" x2="${W-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--line)"/><text x="${L-4}" y="${(yy+3).toFixed(1)}" text-anchor="end" fill="var(--mut)">${fmt1(yv)}</text>`;}
  if(o.goal!=null){const gy=Y(o.goal);s+=`<line x1="${L}" x2="${W-R}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--good)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${(gy-3).toFixed(1)}" text-anchor="end" fill="var(--good)">goal ${fmt1(o.goal)}</text>`;}
  s+=`<path d="${pts.map((p,i)=>(i?"L":"M")+X(p).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ")}" fill="none" stroke="var(--acc)" stroke-width="2"/>`;
  pts.forEach(p=>{s+=`<circle cx="${X(p).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="var(--acc)"><title>${p.d}: ${fmt1(p.y)}</title></circle>`;});
  s+=`<text x="${L}" y="${H-8}" fill="var(--mut)">${fmtShort(d0)}</text><text x="${W-R}" y="${H-8}" text-anchor="end" fill="var(--mut)">${fmtShort(dN)}</text></svg>`;return s;}
function barsSVG(labels,A,B,names){const W=320,H=150,L=24,B0=24,T=12,n=Math.max(1,labels.length);const mx=Math.max(1,...A,...B);
  const gw=(W-L-8)/n,bw=Math.min(22,gw*0.34);let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:200px;font-size:10px">`;const Y=v=>T+(H-T-B0)*(1-v/mx);
  labels.forEach((lb,i)=>{const x0=L+gw*i+gw/2;[[A[i],PAL[0],-bw-2],[B[i],PAL[2],2]].forEach(([v,c,off])=>{const y=Y(v);
    s+=`<rect x="${(x0+off).toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${(H-B0-y).toFixed(1)}" rx="3" fill="${c}"/>`;

  return s+`</svg><div class="mut small"><span style="color:${PAL[0]}">■</span> ${names[0]} &nbsp; <span style="color:${PAL[2]}">■</span> ${names[1]}</div>`;}
function heatmapHTML(today){const start=addDays(today,-dowMon(today)-84);let h=`<div class="hm">`;

function goalRow(g,i,v,dk){const col=colorOf(i),f=fillOf(g,v);let body="";
  if(g.id==="study") body=studyCtl(g,v,dk);
  else if(g.kind==="composite") body=(g.children||[]).map(c=>`<div style="margin-top:10px">${ctl(c,v,dk,true)}</div>`).join("");

function ctl(g,v,dk,sub){const val=v[g.id],k=`f:${g.id}:${dk}`;const lab=sub?`<span class="small" style="font-weight:600;min-width:70px">${esc(g.label)}</span>`:"";

  const n=num(val),warn=warnFor(g.id,n),t=g.target,unit=esc(g.unit||"");

  const q=QUICK[g.id]?`<button class="btn sm" data-act="add" data-id="${g.id}" data-n="${QUICK[g.id]}" data-dk="${dk}">+${QUICK[g.id]}</button>`:"";

  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="dashboard-backup-"+logicalToday()+".json";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);S.settings.lastExport=logicalToday();saveKey("settings");toast("Backup exported");}
function handleImportFile(file){const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);const d=j&&j.data?j.data:j;
    if(!d||!d.meta||d.meta.schemaVersion!==1) throw new Error("bad");pendingImport=d;
    showModal(`<b>Import backup</b><p class="mut small">${Object.keys(d.days||{}).length} logged days, ${(d.lifts||[]).length} lifts, ${((d.body||{}).entries||[]).length} weigh-ins.</p><div class="rowflex"><button class="btn acc" data-act="imp-replace">Replace all</button><button class="btn" data-act="imp-merge">Merge</button><button class="btn" data-act="imp-cancel">Cancel</button></div><p class="mut small">Replace overwrites everything. Merge adds or overwrites by date and keeps your current settings and goal list.</p>`);}
  catch(e){toast("Import failed: not a valid dashboard backup (schemaVersion 1 required)");}};rd.readAsText(file);}
function applyImport(mode){const d=pendingImport;if(!d) return;
  if(mode==="replace"){KEYS.forEach(k=>{if(d[k]!==undefined) S[k]=deep(d[k]);});}
  else{for(const dk in (d.days||{})) S.days[dk]=deep(d.days[dk]);
    (d.lifts||[]).forEach(il=>{const mine=S.lifts.find(l=>l.name===il.name);if(!mine){S.lifts.push(deep(il));return;}
      (il.entries||[]).forEach(ie=>{const c=deep(ie);if(!c.id) c.id=uid();const idx=mine.entries.findIndex(e=>e.date===ie.date);if(idx>=0) mine.entries[idx]=c;else mine.entries.push(c);});});
    if(d.body){if(d.body.heightCm!=null) S.body.heightCm=d.body.heightCm;if(d.body.goalKg!=null) S.body.goalKg=d.body.goalKg;
      (d.body.entries||[]).forEach(ie=>{const idx=S.body.entries.findIndex(e=>e.date===ie.date);if(idx>=0) S.body.entries[idx]=deep(ie);else S.body.entries.push(deep(ie));});}
    for(const yy in (d.year||{})){ensureYearRow(yy);["reading","revision"].forEach(t=>{if(d.year[yy][t]) S.year[yy][t]=deep(d.year[yy][t]);});}
    if(d.meta&&d.meta.firstUse&&d.meta.firstUse<S.meta.firstUse) S.meta.firstUse=d.meta.firstUse;}
  for(const f in DEF.settings) if(S.settings[f]===undefined) S.settings[f]=DEF.settings[f];
  KEYS.forEach(saveKey);pendingImport=null;hideModal();applyTheme();toast(mode==="replace"?"Backup restored":"Backup merged");rerender();}

/* ================= events ================= */
function act(el){const d=el.dataset,a=d.act,today=logicalToday();
  switch(a){
    case "prevday":viewDate=addDays(viewDate,-1);chooser=null;break;
    case "nextday":if(viewDate<today) viewDate=addDays(viewDate,1);chooser=null;break;
    case "tick":{const r=ensureDay(d.dk);r.v[d.id]=r.v[d.id]!==true;commitDay();break;}
    case "add":{const r=ensureDay(d.dk);r.v[d.id]=(num(r.v[d.id])||0)+num(d.n);commitDay();break;}
    case "slot":chooser={dk:d.dk,i:parseInt(d.i)};break;
    case "sess":sessAct(d.dk,parseInt(d.i),d.t);break;
    case "chcancel":chooser=null;break;
    case "gotorow":{const r=$("#row-"+CSS.escape(d.id));if(r) r.scrollIntoView({behavior:"smooth",block:"center"});return;}
    case "export":doExport();break;
    case "snooze":S.settings.nudgeSnoozedUntil=addDays(today,7);saveKey("settings");break;
    case "win":winSel=d.w;break;
    case "addweight":{const dt=$("#wdate").value,kg=num($("#wkg").value);if(!dt||kg==null||kg<=0){toast("Enter a date and a weight");return;}
      const idx=S.body.entries.findIndex(e=>e.date===dt);if(idx>=0) S.body.entries[idx].kg=kg;else S.body.entries.push({date:dt,kg});saveKey("body");
      const w=warnFor("kg",kg);toast(w?"Saved — "+w:"Weigh-in saved");break;}
    case "delweight":{const bk=deep(S.body);S.body.entries=S.body.entries.filter(e=>e.date!==d.date);saveKey("body");toast("Weigh-in deleted",()=>{S.body=bk;saveKey("body");});break;}
    case "lift":openLift=openLift===d.id?null:d.id;break;
    case "cmode":chartMode=d.m;break;
    case "addlift":{const n=($("#newlift").value||"").trim();if(!n){toast("Enter a lift name");return;}S.lifts.push({id:uid(),name:n,entries:[]});saveKey("lifts");break;}
    case "dellift":{const bk=deep(S.lifts);S.lifts=S.lifts.filter(l=>l.id!==d.id);if(openLift===d.id) openLift=null;saveKey("lifts");toast("Lift deleted",()=>{S.lifts=bk;saveKey("lifts");});break;}
    case "addentry":{const l=S.lifts.find(x=>x.id===d.lift);if(!l) return;let e=l.entries.find(x=>x.date===today);
      if(!e){e={id:uid(),date:today,sets:[{w:null,r:null}]};l.entries.push(e);}else if(!e.sets.length) e.sets.push({w:null,r:null});saveKey("lifts");openLift=l.id;break;}
    case "addset":{const e=findEntry(d.lift,d.eid);if(e){const p=e.sets[e.sets.length-1];e.sets.push({w:p?p.w:null,r:p?p.r:null});saveKey("lifts");}break;}
    case "delset":{const e=findEntry(d.lift,d.eid);if(e){const bk=deep(S.lifts);e.sets.splice(parseInt(d.set),1);saveKey("lifts");toast("Set removed",()=>{S.lifts=bk;saveKey("lifts");});}break;}
    case "delentry":{const l=S.lifts.find(x=>x.id===d.lift);if(l){const bk=deep(S.lifts);l.entries=l.entries.filter(e=>e.id!==d.eid);saveKey("lifts");toast("Entry deleted",()=>{S.lifts=bk;saveKey("lifts");});}break;}
    case "mv":{const i=parseInt(d.i),j=i+parseInt(d.d);if(j<0||j>=S.goals.length) return;[S.goals[i],S.goals[j]]=[S.goals[j],S.goals[i]];saveKey("goals");break;}
    case "gact":{const g=S.goals[parseInt(d.i)];g.active=!(g.active!==false);saveKey("goals");break;}
    case "cact":{const c=S.goals[parseInt(d.i)].children[parseInt(d.c)];c.active=!(c.active!==false);saveKey("goals");break;}
    case "delgoal":{const i=parseInt(d.i);if(BUILTIN.has(S.goals[i].id)) return;const bk=deep(S.goals),nm=S.goals[i].label;S.goals.splice(i,1);saveKey("goals");toast(`"${nm}" deleted (past days keep it)`,()=>{S.goals=bk;saveKey("goals");});break;}
    case "addgoal":addGoal();break;
    case "tog":S.settings[d.s]=!S.settings[d.s];saveKey("settings");break;
    case "theme":S.settings.theme=d.t;saveKey("settings");applyTheme();break;
    case "imp-replace":applyImport("replace");return;
    case "imp-merge":applyImport("merge");return;
    case "imp-cancel":pendingImport=null;hideModal();return;
    default:return;}
  rerender();}
function onChange(t){const d=t.dataset,today=logicalToday();
  if(t.id==="importfile"){if(t.files&&t.files[0]) handleImportFile(t.files[0]);t.value="";return;}
  if(t.id==="wdate"||t.id==="wkg"||t.id==="newlift"||t.id.indexOf("ng-")===0) return;
  if(d.field){const r=ensureDay(d.dk);const n=num(t.value);if(n==null||t.value==="") delete r.v[d.field];else r.v[d.field]=Math.max(0,n);commitDay();}
  else if(d.hs){const y=yearOf(today);ensureYearRow(y);S.year[y][d.hs].headStart=Math.max(0,Math.round(num(t.value)||0));saveKey("year");}
  else if(d.yt){const y=yearOf(today);const n=num(t.value);if(n==null||n<1) toast("Target must be at least 1");else S.year[y][d.yt].target=Math.round(n);saveKey("year");}
  else if(d.bf){const n=num(t.value);S.body[d.bf]=(n==null||t.value==="")?null:Math.max(0,n);saveKey("body");}
  else if(d.ef){const e=findEntry(d.lift,d.eid);if(!e) return;
    if(d.ef==="date"){const l=S.lifts.find(x=>x.id===d.lift);if(!t.value) return;if(l.entries.some(x=>x.id!==e.id&&x.date===t.value)) toast("An entry already exists for that date");else e.date=t.value;}
    else{const s=e.sets[parseInt(d.set)];if(s){const n=num(t.value);s[d.ef]=(n==null||t.value==="")?null:Math.max(0,n);}}saveKey("lifts");}
  else if(d.lf){const l=S.lifts.find(x=>x.id===d.lf);const v=(t.value||"").trim();if(l&&v) l.name=v;saveKey("lifts");}
  else if(d.sf){const g=S.goals[parseInt(d.i)];const o=(d.c!=null&&d.c!=="")?g.children[parseInt(d.c)]:g;const f=d.sf;
    if(f==="label"){const v=(t.value||"").trim();if(v) o.label=v;}else if(f==="unit") o.unit=(t.value||"").trim();
    else{const n=num(t.value);if(n==null||n<1) toast((f==="tol"?"Tolerance":"Target")+" must be at least 1");else o[f]=n;}saveKey("goals");}
  else if(d.cfg){const n=num(t.value);if(n==null) return;const lim={streakMin:[50,100],rolloverHour:[0,6],backfillDays:[1,30]}[d.cfg];S.settings[d.cfg]=clamp(Math.round(n),lim[0],lim[1]);saveKey("settings");}
  else return;
  commitAndRender();}
function bindEvents(){
  $("#nav").addEventListener("click",e=>{const b=e.target.closest("[data-nav]");if(b) show(b.dataset.nav);});
  $("#toastundo").addEventListener("click",()=>{if(toastUndoFn) toastUndoFn();$("#toast").style.display="none";toastUndoFn=null;clearTimeout(toastTimer);rerender();});
  $("#modal").addEventListener("click",e=>{if(e.target.id==="modal"){pendingImport=null;hideModal();}});
  document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled) return;act(el);});
  document.addEventListener("change",e=>onChange(e.target));
  document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input")) e.target.blur();});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden) rerender();});
  window.addEventListener("storage",e=>{if(e.key&&e.key.indexOf("hb:")===0){loadAll();rerender();}});}

/* ================= boot ================= */
function boot(){loadAll();viewDate=logicalToday();lastToday=viewDate;ensureYearRow(yearOf(viewDate));applyTheme();bindEvents();show("today");
  if(corruptNote) toast("A stored item was corrupt — it was backed up and reset.");
  if(!S.meta.persistAsked&&navigator.storage&&navigator.storage.persist){S.meta.persistAsked=true;saveKey("meta");try{navigator.storage.persist().catch(()=>{});}catch(e){}}}
document.addEventListener("DOMContentLoaded",boot);
</script>
